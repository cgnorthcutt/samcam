    const cookieName = "vision_unlock";

    const readUnlockKey = () => {
      if (serverUnlockKey) return { encoded: serverUnlockKey, server: true };
      try {
        const saved = localStorage.getItem(cookieName);
        if (saved) return { encoded: saved, server: false };
      } catch (storageError) {}
      const prefix = cookieName + "=";
      const entry = document.cookie.split("; ").find((item) => item.startsWith(prefix));
      return entry ? { encoded: decodeURIComponent(entry.slice(prefix.length)), server: false } : null;
    };

    const clearUnlockState = async () => {
      try { localStorage.removeItem(cookieName); } catch (storageError) {}
      document.cookie = cookieName + "=; Max-Age=0; Path=/; Secure; SameSite=Lax";
      document.cookie = cookieName + "=; Max-Age=0; Path=/vision; Secure; SameSite=Strict";
      try {
        await fetch("/vision/session/clear", { method: "POST", credentials: "same-origin" });
      } catch (requestError) {}
    };

    const saveUnlockKey = async (key) => {
      const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
      const encoded = btoa(String.fromCharCode(...raw));
      try { localStorage.setItem(cookieName, encoded); } catch (storageError) {}
      document.cookie = cookieName + "=" + encodeURIComponent(encoded) + "; Max-Age=31536000; Path=/; Secure; SameSite=Lax";
      try {
        await fetch("/vision/session", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ key: encoded })
        });
      } catch (requestError) {}
    };

    const decryptAndOpen = async (key, persist = false) => {
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: decode64(payload.iv) }, key, decode64(payload.ciphertext)
      );
      if (persist) await saveUnlockKey(key);
      document.open();
      document.write(new TextDecoder().decode(plaintext));
      document.close();
    };

    const openGate = () => {
      if (modal.classList.contains("is-open")) return;
      modal.classList.add("is-open");
      modal.setAttribute("aria-hidden", "false");
      document.body.classList.add("gate-open");
      window.setTimeout(() => input.focus(), 180);
    };

    document.querySelector("[data-open-gate]").addEventListener("click", openGate);
    window.addEventListener("scroll", () => {
      if (window.scrollY > 24) openGate();
    }, { passive: true });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      error.hidden = true;
      button.disabled = true;
      button.textContent = "...";
      try {
        const material = await crypto.subtle.importKey(
          "raw", new TextEncoder().encode(input.value), "PBKDF2", false, ["deriveKey"]
        );
        const key = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: decode64(payload.salt), iterations: payload.iterations, hash: "SHA-256" },
          material,
          { name: "AES-GCM", length: 256 },
          true,
          ["decrypt"]
        );
        input.value = "";
        await decryptAndOpen(key, true);
      } catch (unlockError) {
        input.value = "";
        error.hidden = false;
        input.focus();
        button.disabled = false;
        button.textContent = "enter";
      }
    });

    (async () => {
      const saved = readUnlockKey();
      if (!saved) return;
      try {
        const key = await crypto.subtle.importKey("raw", decode64(saved.encoded), { name: "AES-GCM" }, false, ["decrypt"]);
        await decryptAndOpen(key, !saved.server);
      } catch (restoreError) {
        await clearUnlockState();
      }
    })();
  </script>
</body>
</html>
