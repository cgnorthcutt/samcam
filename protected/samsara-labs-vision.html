  <script>
    const decode64 = (value) => Uint8Array.from(atob(value), (char) => char.charCodeAt(0));
    const modal = document.getElementById("gate-modal");
    const form = document.getElementById("vision-unlock");
    const input = document.getElementById("password");
    const button = document.getElementById("unlock-button");
    const error = document.getElementById("lock-error");
    const payload = JSON.parse(document.getElementById("encrypted-vision").textContent);
    const cookieName = "vision_unlock";

    const readUnlockCookie = () => {
      const prefix = cookieName + "=";
      const entry = document.cookie.split("; ").find((item) => item.startsWith(prefix));
      return entry ? decodeURIComponent(entry.slice(prefix.length)) : null;
    };

    const clearUnlockCookie = () => {
      document.cookie = cookieName + "=; Max-Age=0; Path=/vision; Secure; SameSite=Strict";
    };

    const saveUnlockKey = async (key) => {
      const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
      const encoded = btoa(String.fromCharCode(...raw));
      document.cookie = cookieName + "=" + encodeURIComponent(encoded) + "; Max-Age=2592000; Path=/vision; Secure; SameSite=Strict";
    };

    const decryptAndOpen = async (key, persist = false) => {
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: decode64(payload.iv) }, key, decode64(payload.ciphertext)
      );
      if (persist) await saveUnlockKey(key);
      document.open();
      document.write(new TextDecoder().decode(plaintext));
      document.close();
    };

    const openGate = () => {
      if (modal.classList.contains("is-open")) return;
      modal.classList.add("is-open");
      modal.setAttribute("aria-hidden", "false");
      document.body.classList.add("gate-open");
      window.setTimeout(() => input.focus(), 180);
    };

    document.querySelector("[data-open-gate]").addEventListener("click", openGate);
    window.addEventListener("scroll", () => {
      if (window.scrollY > 24) openGate();
    }, { passive: true });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      error.hidden = true;
      button.disabled = true;
      button.textContent = "...";
      try {
        const material = await crypto.subtle.importKey(
          "raw", new TextEncoder().encode(input.value), "PBKDF2", false, ["deriveKey"]
        );
        const key = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: decode64(payload.salt), iterations: payload.iterations, hash: "SHA-256" },
          material,
          { name: "AES-GCM", length: 256 },
          true,
          ["decrypt"]
        );
        input.value = "";
        await decryptAndOpen(key, true);
      } catch (unlockError) {
        input.value = "";
        error.hidden = false;
        input.focus();
        button.disabled = false;
        button.textContent = "enter";
      }
    });

    (async () => {
      const saved = readUnlockCookie();
      if (!saved) return;
      try {
        const key = await crypto.subtle.importKey("raw", decode64(saved), { name: "AES-GCM" }, false, ["decrypt"]);
        await decryptAndOpen(key);
      } catch (restoreError) {
        clearUnlockCookie();
      }
    })();
  </script>
