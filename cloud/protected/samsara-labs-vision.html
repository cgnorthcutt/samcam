  <script>
    const decode64 = (value) => Uint8Array.from(atob(value), (char) => char.charCodeAt(0));
    const form = document.getElementById("vision-unlock");
    const input = document.getElementById("password");
    const button = document.getElementById("unlock-button");
    const error = document.getElementById("lock-error");
    const payload = JSON.parse(document.getElementById("encrypted-vision").textContent);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      error.hidden = true;
      button.disabled = true;
      button.textContent = "Opening...";
      try {
        const material = await crypto.subtle.importKey(
          "raw",
          new TextEncoder().encode(input.value),
          "PBKDF2",
          false,
          ["deriveKey"]
        );
        const key = await crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt: decode64(payload.salt),
            iterations: payload.iterations,
            hash: "SHA-256",
          },
          material,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );
        const plaintext = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: decode64(payload.iv) },
          key,
          decode64(payload.ciphertext)
        );
        input.value = "";
        const article = new TextDecoder().decode(plaintext);
        document.open();
        document.write(article);
        document.close();
      } catch (unlockError) {
        input.value = "";
        error.hidden = false;
        input.focus();
        button.disabled = false;
        button.textContent = "Enter";
      }
    });
  </script>
